# Builds every package folder (a folder with a pixi.toml [package]) on pushes to main, and publishes one package to
# https://prefix.dev/vslamlab/vslamlab when a tag <package>-vX.Y.Z is pushed (e.g. pypose-v0.7.3).
# Publishing uses prefix.dev trusted publishing (OIDC): prefix.dev > Settings > Repository Access > GitHub,
# repository VSLAM-LAB/conda-recipes, workflow conda-package.yml, read/write on vslamlab/vslamlab. No API key is stored.
name: conda-package

on:
  push:
    branches: [main]
    tags: ["*-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            pkg="${GITHUB_REF_NAME%-v*}"
            [ -f "$pkg/pixi.toml" ] || { echo "tag $GITHUB_REF_NAME: no package folder $pkg/"; exit 1; }
            echo "packages=[\"$pkg\"]" >> "$GITHUB_OUTPUT"
          else
            echo "packages=$(python3 -c 'import glob, json, os; print(json.dumps(sorted(os.path.dirname(p) for p in glob.glob("*/pixi.toml"))))')" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      # CUDA/PyTorch build environments do not fit in the runner's default free space
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          tag = os.environ['GITHUB_REF_NAME'].split('-v')[-1]
          version = tomllib.load(open(f"{os.environ['PACKAGE']}/pixi.toml", 'rb'))['package']['version']
          if tag != version:
              sys.exit(f'tag {os.environ["GITHUB_REF_NAME"]} does not match {os.environ["PACKAGE"]}/pixi.toml version {version}')
          print(f'version {version} OK')
          EOF

      # --clean: pixi reuses its build directory otherwise, and stale files end up in the package
      - name: Build
        run: pixi publish --clean --path "${{ matrix.package }}/pixi.toml" --target-dir "out/${{ matrix.package }}"

      # Each package's pixi.toml defines a `test` task (no GPU on the runner)
      - name: Test
        run: pixi run --manifest-path "${{ matrix.package }}/pixi.toml" test

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-packages
          path: out/${{ matrix.package }}/*.conda

  publish:
    needs: [discover, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing to prefix.dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-packages"
          path: packages
          merge-multiple: true

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      # --skip-existing: a re-run after a partial upload never overwrites a published file
      - name: Upload to prefix.dev
        run: pixi exec rattler-build upload prefix --skip-existing --channel vslamlab/vslamlab packages/*.conda
